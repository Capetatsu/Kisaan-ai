services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisaan-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - kisaan-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kisaan-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - kisaan-network

  db:
    image: postgres:16-alpine
    container_name: kisaan-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kisaan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kisaan-network

volumes:
  postgres_data:

networks:
  kisaan-network:
    driver: bridge